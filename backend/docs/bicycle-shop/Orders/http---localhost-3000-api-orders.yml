info:
  name: http://localhost:3000/api/orders
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:3000/api/orders
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "customerId": 1,
        "status": "paid"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
